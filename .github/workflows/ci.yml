# main への push とプルリクエストで、ビルドとテストを実行する。
#
# UIテストは Avalonia.Headless を実描画モード（Skia）で動かすため、
# 画面が無い環境でも動作する。Xサーバは不要。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ビルドとテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK の準備
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 依存関係の復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build -c Release --no-restore

      - name: テスト
        # --blame-hang-timeout: 個々のテストが90秒（ローカル実測の最遅テストの十数倍の余裕）を
        # 超えて戻らない場合、そのテストのダンプを採取してテストホストごと打ち切る。
        # test.runsettingsのTestSessionTimeout（15分、セッション全体の保険）はそのまま残しつつ、
        # 「どのテストがハングしたか分からないまま15分間無音で待つ」事故を防ぐための、
        # テスト単位の下限側の歯止め。
        run: >
          dotnet test -c Release --no-build --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type mini
