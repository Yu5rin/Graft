# Windows と Linux 向けの発行物一式を生成し、GitHub Release として公開するワークフロー。
#
# リリースは tools/New-Release.ps1 を使った手作業で行う方針のため、タグ push では
# 動かさない。かつては v で始まるタグを push すると自動発火する設定だったが、
# tools/New-Release.ps1 による手作業のリリースと二重に動いてしまい、同じ版の書庫
# （Graft-<バージョン>-win-x64.zip と Graft-v<バージョン>-win-x64.zip 等）が
# 並んで公開される事故が起きたため、workflow_dispatch（Actions画面からの手動実行のみ）に変更した。
# 中身の発行手順（Windows・Linux両対応、書庫の作り方、初回起動が遅くなる設定の回避など）は
# 動作実績のある知見のため、そのまま残してある。手元で試したいときはActions画面から手動実行できる。
#
# 発行は README「発行」節と同じコマンドを使う。単一ファイル形式の自己完結型のため、
# 利用者側に .NET ランタイムの導入は要らない。PublishSingleFile / EnableCompressionInSingleFile
# の各種設定は Graft.csproj に既定値として書いてあるため、ここでは -p: 指定を重ねない
# （README「発行」節参照）。ネイティブライブラリの自己展開（IncludeNativeLibrariesForSelfExtract）
# はcsproj側で明示的にfalseにしており、これがtrueだと初回起動が約5.44秒に悪化することが
# 実測で分かっている。発行物は実行ファイル＋ネイティブDLL3つの計4ファイル。
# Windows 向けもLinuxランナー上で生成する。.NET はクロスOSの発行に対応しており、
# ReadyToRun のプリコンパイルも対象OS向けに正しく行われる。
name: リリース

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 発行してリリースを作成
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: .NET SDK の準備
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      # 壊れたものを配らないよう、発行の前に必ずテストを通す。
      - name: テスト
        run: dotnet test -c Release

      # 発行先を配布物の名前と同じフォルダにしておく。こうしておくと書庫の中に
      # 「Graft-v1.0.0-win-x64/」という単一のフォルダだけが入るので、利用者が
      # ダウンロードフォルダ等でそのまま展開してもファイルが散らばらない
      # （単一ファイル形式でも実行ファイル＋ネイティブDLL3つの計4ファイルが同梱される
      # ため、書庫のトップに必ずフォルダを1つ挟むことが重要になる。実行ファイルだけを
      # 取り出すと起動できない）。
      - name: Windows 向けに発行
        run: |
          dotnet publish src/Graft -c Release -r win-x64 --self-contained true \
            -p:DebugType=none -o publish/Graft-${{ github.ref_name }}-win-x64

      - name: Linux 向けに発行
        run: |
          dotnet publish src/Graft -c Release -r linux-x64 --self-contained true \
            -p:DebugType=none -o publish/Graft-${{ github.ref_name }}-linux-x64

      # 発行物一式（実行ファイル＋ネイティブDLL3つの計4ファイル）をまとめて圧縮する。
      # Linux 版は zip では実行権限が失われるので tar.gz を使う。
      - name: 配布物をまとめる
        run: |
          cd publish && zip -9 -r ../Graft-${{ github.ref_name }}-win-x64.zip \
            Graft-${{ github.ref_name }}-win-x64 && cd ..
          tar -czf Graft-${{ github.ref_name }}-linux-x64.tar.gz \
            -C publish Graft-${{ github.ref_name }}-linux-x64

      # リリース本文は「## 変更点」と「## ダウンロード」の2節だけにし、最後に README への
      # 案内を1行置く（インストール・更新・機能の説明は README に置き、リリースごとに
      # 繰り返さない。CLAUDE.md「リリース」節参照）。変更点は docs/変更履歴.md の
      # 「## <版>」の節から取り、末尾の「### バージョン」（版上げの記録）は除く。
      # 自動更新はリリース本文を読まない（ファイル名とアセットの digest だけを使う）ため、
      # 本文の形を変えても更新の動作には影響しない。
      - name: リリース本文を組み立てる
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          CHANGES="$(awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($0 == "## " ver) { found = 1; next } }
            found { print }
          ' docs/変更履歴.md | awk '
            { lines[NR] = $0 }
            END {
              n = NR
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              if (n >= 2 && lines[n] ~ /^- `[^`]*`$/ && lines[n-1] == "### バージョン") n -= 2
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              s = 1
              while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              for (i = s; i <= n; i++) print lines[i]
            }')"
          if [ -z "$CHANGES" ]; then
            echo "::warning::docs/変更履歴.md に「## $VERSION」の節が見つかりません。変更点は空欄のまま下書きにします。"
          fi
          row() {
            local size
            size=$(stat -c %s "$1")
            printf '| `%s` | %s | `%s` |\n' "$1" \
              "$(awk -v b="$size" 'BEGIN { if (b >= 1048576) printf "%.1f MB", b / 1048576; else printf "%.1f KB", b / 1024 }')" \
              "$(sha256sum "$1" | cut -d' ' -f1)"
          }
          {
            printf '## 変更点\n\n%s\n\n' "$CHANGES"
            printf '## ダウンロード\n\n| ファイル | サイズ | SHA256 |\n|---|---|---|\n'
            row "Graft-${TAG}-win-x64.zip"
            row "Graft-${TAG}-linux-x64.tar.gz"
            printf '\nインストールと更新の方法は [README](https://github.com/Yu5rin/Graft#インストール) をご覧ください。\n'
          } > release-body.md
          cat release-body.md

      - name: リリースを作成
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # タイトルはタグと同じ表記にする（例: v1.0.20）。
          name: ${{ github.ref_name }}
          draft: true
          files: |
            Graft-${{ github.ref_name }}-win-x64.zip
            Graft-${{ github.ref_name }}-linux-x64.tar.gz
          body_path: release-body.md
