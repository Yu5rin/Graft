# Windows と Linux 向けの発行物一式を生成し、GitHub Release として公開するワークフロー。
#
# リリースは tools/New-Release.ps1 を使った手作業で行う方針のため、タグ push では
# 動かさない。かつては v で始まるタグを push すると自動発火する設定だったが、
# tools/New-Release.ps1 による手作業のリリースと二重に動いてしまい、同じ版の書庫
# （Graft-<バージョン>-win-x64.zip と Graft-v<バージョン>-win-x64.zip 等）が
# 並んで公開される事故が起きたため、workflow_dispatch（Actions画面からの手動実行のみ）に変更した。
# 中身の発行手順（Windows・Linux両対応、書庫の作り方、初回起動が遅くなる設定の回避など）は
# 動作実績のある知見のため、そのまま残してある。手元で試したいときはActions画面から手動実行できる。
#
# 発行は README「発行」節と同じコマンドを使う。単一ファイル形式の自己完結型のため、
# 利用者側に .NET ランタイムの導入は要らない。PublishSingleFile / EnableCompressionInSingleFile
# の各種設定は Graft.csproj に既定値として書いてあるため、ここでは -p: 指定を重ねない
# （README「発行」節参照）。ネイティブライブラリの自己展開（IncludeNativeLibrariesForSelfExtract）
# はcsproj側で明示的にfalseにしており、これがtrueだと初回起動が約5.44秒に悪化することが
# 実測で分かっている。発行物は実行ファイル＋ネイティブDLL3つの計4ファイル。
# Windows 向けもLinuxランナー上で生成する。.NET はクロスOSの発行に対応しており、
# ReadyToRun のプリコンパイルも対象OS向けに正しく行われる。
#
# 【配布物の形は tools/New-Release.ps1 と揃える（自動更新の前提。2026-09-25 修正）】
# アプリの自動更新は、添付ファイルと書庫の中身について次を前提にしている。
#   - 名前は Graft-<タグから先頭の v を除いた版>-win-x64.zip / -linux-x64.tar.gz
#     （src/Graft/Core/Update/UpdatePlatformPolicy.cs の BuildAssetFileName。GitHub API に
#     届かないときは、この規則でダウンロードURLを組み立てる）
#   - Windows 版の zip の中身は src/Graft/Core/Update/UpdateFiles.cs の RequiredFileNames
#     の6ファイルと過不足なく一致する（1つでも欠けたり余計なものがあると、更新を中止する）
# 以前のこのワークフローはタグそのもの（v 付き）を名前に使い（Graft-v1.0.1-win-x64.zip。
# 実際に v1.0.0・v1.0.1 の添付はこの名前）、書庫に 取扱説明書.md と
# はじめにお読みください.txt を入れていなかった。そのため、ここで作ったリリースは
# API に届かないときの自動更新では404になり、API で添付が見つかっても中身の検査で
# 「必要なファイルが不足」として必ず中止されていた。v1.0.2 以降の実際のリリースは
# tools/New-Release.ps1 で作られており、そちらの形（v なしの名前、書庫のトップは Graft/）に
# 合わせて直した。tests/Graft.Tests/UpdatePlatformPolicyTests.cs がこのファイルを読んで、
# 名前の付け方と中身の一覧が自動更新の前提から外れていないことを確かめている。
name: リリース

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 発行してリリースを作成
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: .NET SDK の準備
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      # 壊れたものを配らないよう、発行の前に必ずテストを通す。
      - name: テスト
        run: dotnet test -c Release

      # 版を決める。タグ（v1.0.21 等）を選んで実行したときだけ進める。workflow_dispatch を
      # ブランチ（main 等）で実行すると github.ref_name が "main" になり、添付の名前が
      # Graft-main-win-x64.zip になってしまうため、ここで止める。
      # また Graft.csproj の <Version> とタグがずれていると、アプリが名乗る版と添付の名前が
      # 食い違う（自動更新は版の比較と添付の名前の両方をタグから決める）ため、これも止める。
      - name: 版の確認
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::v で始まるタグを選んで実行してください（今は ${GITHUB_REF_TYPE} の ${GITHUB_REF_NAME}）"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Graft/Graft.csproj | head -n 1)"
          if [ "${VERSION}" != "${CSPROJ_VERSION}" ]; then
            echo "::error::タグ（${GITHUB_REF_NAME}）と Graft.csproj の <Version>（${CSPROJ_VERSION}）が一致しません"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # 書庫の中には「Graft/」という単一のフォルダだけを入れる（tools/New-Release.ps1 と同じ）。
      # こうしておくと利用者がダウンロードフォルダ等でそのまま展開してもファイルが散らばらない
      # （単一ファイル形式でも実行ファイル＋ネイティブDLLが同梱されるため、書庫のトップに
      # 必ずフォルダを1つ挟むことが重要になる。実行ファイルだけを取り出すと起動できない）。
      - name: Windows 向けに発行
        run: |
          dotnet publish src/Graft -c Release -r win-x64 --self-contained true \
            -p:DebugType=none -o publish/win/Graft

      - name: Linux 向けに発行
        run: |
          dotnet publish src/Graft -c Release -r linux-x64 --self-contained true \
            -p:DebugType=none -o publish/linux/Graft

      # 同梱物（取扱説明書.md・はじめにお読みください.txt）を置く。どちらも自動更新が
      # 入れ替えるファイルの一覧（UpdateFiles.RequiredFileNames）に含まれており、無いと
      # 更新が中止される。はじめにお読みください.txt の文面は tools/New-Release.ps1 の
      # $readmeText（Windows 版）・$linuxReadmeText（Linux 版）を唯一の原本とし、ここでは
      # そこから抜き出して、同じ形（BOM 付き UTF-8・CRLF）で書き出す。文面を二重に持たない
      # ため。抜き出せなければ（スクリプト側の書き方が変わった等）ここで失敗させる。
      - name: 同梱物を置く
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cp docs/取扱説明書.md publish/win/Graft/
          cp docs/取扱説明書.md publish/linux/Graft/
          python3 - <<'PY'
          import os, re, sys
          src = open('tools/New-Release.ps1', encoding='utf-8-sig').read()
          title = 'Graft ' + os.environ['VERSION']
          for var, dest in (('readmeText', 'publish/win/Graft'), ('linuxReadmeText', 'publish/linux/Graft')):
              m = re.search(r'^\$' + var + r' = @"\r?\n(.*?)\r?\n"@', src, re.S | re.M)
              if m is None:
                  sys.exit(f'tools/New-Release.ps1 に ${var} が見つかりません')
              text = m.group(1).replace('$readmeTitle', title).replace('$readmeUnderline', '=' * len(title))
              if '$' in text:
                  sys.exit(f'${var} に展開できない変数が残っています')
              text = text.replace('\r\n', '\n').replace('\n', '\r\n')
              with open(os.path.join(dest, 'はじめにお読みください.txt'), 'wb') as f:
                  f.write(b'\xef\xbb\xbf' + text.encode('utf-8'))
          PY

      # 発行物一式をまとめて圧縮する。Linux 版は zip では実行権限が失われるので tar.gz を使う。
      # Windows 版の zip は zip コマンドではなく Python の zipfile で作る。同梱物の名前が
      # 日本語のため、名前が UTF-8 であることを示す印（汎用フラグの第11ビット）が要る。
      # この開発環境の zip 3.0 で試すと印が付かず、Python の zipfile で読むと
      # 「σÅûµë▒Φ¬¼µÿÄµ¢╕.md」のように化けた（エクスプローラーでの展開でも化けうる）。
      # zipfile は ASCII 以外の名前に必ずこの印を付ける。tools/New-Release.ps1 の
      # Compress-Archive で作った実物（v1.0.20）も、日本語の2ファイルには印が付いている。
      - name: 配布物をまとめる
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "Graft-${VERSION}-win-x64.zip" publish/win <<'PY'
          import os, sys, zipfile
          dest, root = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(dest, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(os.listdir(os.path.join(root, 'Graft'))):
                  z.write(os.path.join(root, 'Graft', name), 'Graft/' + name)
          PY
          tar -czf "Graft-${VERSION}-linux-x64.tar.gz" -C publish/linux Graft

      # Windows 版の zip の中身が、自動更新の入れ替え対象（UpdateFiles.RequiredFileNames）と
      # 過不足なく一致するかを確かめる。ずれていると、配ったあとで利用者の自動更新が
      # 「想定外のファイル」「必要なファイルが不足」で必ず中止されるため、配る前に止める。
      # 一覧を変えるときは UpdateFiles.cs と tools/New-Release.ps1 の $requiredFiles も合わせる。
      - name: 配布物の中身を確かめる
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            'Graft.exe' \
            'av_libglesv2.dll' \
            'libHarfBuzzSharp.dll' \
            'libSkiaSharp.dll' \
            '取扱説明書.md' \
            'はじめにお読みください.txt' | LC_ALL=C sort)"
          actual="$(python3 -c 'import sys, zipfile; print("\n".join(sorted((n.rsplit("/", 1)[-1] for n in zipfile.ZipFile(sys.argv[1]).namelist() if not n.endswith("/")), key=lambda s: s.encode())))' "Graft-${VERSION}-win-x64.zip")"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Windows 版 zip の中身が自動更新の前提と一致しません"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
          tar -tzvf "Graft-${VERSION}-linux-x64.tar.gz"

      # リリース本文は「## 変更点」と「## ダウンロード」の2節だけにし、最後に README への
      # 案内を1行置く（インストール・更新・機能の説明は README に置き、リリースごとに
      # 繰り返さない。CLAUDE.md「リリース」節参照）。変更点は docs/変更履歴.md の
      # 「## <版>」の節から取り、末尾の「### バージョン」（版上げの記録）は除く。
      # 自動更新はリリース本文を読まない（ファイル名とアセットの digest だけを使う）ため、
      # 本文の形を変えても更新の動作には影響しない。
      - name: リリース本文を組み立てる
        env:
          TAG: ${{ github.ref_name }}
        # 添付が見つからないときに、サイズ 0.0 KB・SHA256 空欄の表のまま下書きを作らないよう、
        # 失敗したらここで止める。
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHANGES="$(awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($0 == "## " ver) { found = 1; next } }
            found { print }
          ' docs/変更履歴.md | awk '
            { lines[NR] = $0 }
            END {
              n = NR
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              if (n >= 2 && lines[n] ~ /^- `[^`]*`$/ && lines[n-1] == "### バージョン") n -= 2
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              s = 1
              while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              for (i = s; i <= n; i++) print lines[i]
            }')"
          if [ -z "$CHANGES" ]; then
            echo "::warning::docs/変更履歴.md に「## $VERSION」の節が見つかりません。変更点は空欄のまま下書きにします。"
          fi
          row() {
            local size
            size=$(stat -c %s "$1")
            printf '| `%s` | %s | `%s` |\n' "$1" \
              "$(awk -v b="$size" 'BEGIN { if (b >= 1048576) printf "%.1f MB", b / 1048576; else printf "%.1f KB", b / 1024 }')" \
              "$(sha256sum "$1" | cut -d' ' -f1)"
          }
          {
            printf '## 変更点\n\n%s\n\n' "$CHANGES"
            printf '## ダウンロード\n\n| ファイル | サイズ | SHA256 |\n|---|---|---|\n'
            row "Graft-${VERSION}-win-x64.zip"
            row "Graft-${VERSION}-linux-x64.tar.gz"
            printf '\nインストールと更新の方法は [README](https://github.com/Yu5rin/Graft#インストール) をご覧ください。\n'
          } > release-body.md
          cat release-body.md

      - name: リリースを作成
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # タイトルはタグと同じ表記にする（例: v1.0.20）。
          name: ${{ github.ref_name }}
          draft: true
          files: |
            Graft-${{ steps.ver.outputs.version }}-win-x64.zip
            Graft-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
          body_path: release-body.md
